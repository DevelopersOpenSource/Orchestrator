[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/llm",
    "crates/memory",
    "crates/cli-adapter",
    "crates/service",
    "crates/cli",
    "crates/mcp-server",
    "crates/notify",
    "crates/engine",
    "crates/tui",
    "crates/sandbox",
    "crates/memoryd",
    "web/apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["sodre"]
repository = "https://github.com/EchoGroupStudio/Orchestrator"
description = "Orchestrator — segundo cérebro de contexto para agentes CLI"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
fastembed = "6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
ratatui = "0.29"
crossterm = "0.28"
portable-pty = "0.8"
vt100 = "0.15"
tui-term = "0.2"
notify-rust = "4"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
